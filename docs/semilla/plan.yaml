esquema: plan/v1
semilla: calesa-web v7
agentes_disponibles: [claude]

# Comandos del kit (AGENTS.md › Comandos).
ruteo_por_defecto:
  rojo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
  normal: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
  rutina: {agente: claude, modelo: sonnet, effort: medium, modo: auto, sesion: nueva, revisor: ninguno}

carriles:
  - id: base
    dueno_de: [package.json, pnpm-lock.yaml, next.config.ts, eslint.config.mjs, .env.example, .github/, src/app/layout.tsx, src/app/globals.css, src/app/not-found.tsx, src/app/manifest.ts, src/shared/config/, src/shared/lib/, src/shared/ui/, src/shared/CLAUDE.md, design/, public/marca/, e2e/base/]
  - id: datos
    dueno_de: [supabase/, src/shared/types/]
  - id: calculadora
    dueno_de: [src/modules/calculadora/, src/modules/planes/, src/app/(app)/panel/calculadora/, e2e/calculadora/]
  - id: ventas
    dueno_de: [src/modules/agenda/, src/modules/solicitudes/, src/app/agendar/, src/app/reunion/, src/app/api/solicitudes/, src/app/api/reservas/, src/app/api/horas/, src/app/(app)/panel/solicitudes/, src/app/(app)/panel/reuniones/, src/app/(app)/panel/disponibilidad/, e2e/ventas/]
  - id: notificaciones
    dueno_de: [src/modules/notificaciones/]
  - id: sitio
    dueno_de: [src/modules/sitio/, src/app/(sitio)/, src/app/sitemap.ts, src/app/robots.ts, src/app/opengraph-image.tsx, public/media/, public/ilustraciones/, e2e/sitio/]
  - id: equipo
    dueno_de: [src/modules/equipo/, src/modules/prospeccion/, src/app/(app)/panel/equipo/, src/app/(app)/panel/prospeccion/, e2e/equipo/]
  - id: tareas
    dueno_de: [vercel.json, src/modules/medicion/, src/app/api/whatsapp/, src/app/api/eventos/, src/app/api/cron/, src/app/api/webhooks/, e2e/tareas/]
  - id: acceso
    dueno_de: [src/modules/acceso/, src/proxy.ts, src/app/(app)/layout.tsx, src/app/(app)/_shell/, src/app/(app)/panel/page.tsx, src/app/(app)/panel/usuarios/, src/app/(app)/panel/perfil/, src/app/(app)/panel/actividad/, src/app/entrar/, e2e/acceso/]
  - id: calidad
    dueno_de: [e2e/flujos/, e2e/rendimiento/, e2e/accesibilidad/]
  - id: lanzamiento
    dueno_de: [infra/]

pasos:
  - id: P01
    titulo: Adaptar la base del kit a Calesa (entorno, correo Resend, fuentes, tema, cabeceras, componentes, respaldos)
    depende_de: []
    carril: base
    riesgo: rojo
    modulos: [package.json, pnpm-lock.yaml, next.config.ts, eslint.config.mjs, .env.example, .github/, src/app/layout.tsx, src/app/globals.css, src/app/not-found.tsx, src/app/manifest.ts, src/shared/config/, src/shared/lib/email/, src/shared/lib/formato.ts, src/shared/ui/, src/shared/CLAUDE.md, design/, public/marca/, e2e/base/, docs/]
    decisiones: [F1, F3, F4, F9, E1, E4, E7, E8, D5, D6, X13, X15, X16, X17]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 2, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check && pnpm db:reset && pnpm db:probar && pnpm test:e2e:completo"}
    terminado: >-
      Sobre lo que trae el kit: variables de §4 en src/shared/config/esquemas.ts y .env.example; adaptador
      resend en src/shared/lib/email/adaptadores/ con enviar, programar (scheduledAt), cancelar y
      reprogramar, probado con un fetch falso; formato de montos US$ de §5.1 en formato.ts con sus
      ejemplos; Archivo y JetBrains Mono con next/font y next-themes en «system» con la clase .dark;
      @vercel/analytics; CSP y cabeceras de §4 en next.config.ts; rutas admin de §9.1 en
      DONDE_SE_PERMITE_EL_ADMIN; componentes de §8.5 en src/shared/ui con sonner para avisos; logos en
      public/marca; respaldo-diario.yml y restauracion-semanal.yml; el e2e de humo del kit pasa.

  - id: P02
    titulo: Esquema, permisos, RLS, storage y semillas de datos
    depende_de: [P01]
    carril: datos
    riesgo: rojo
    modulos: [supabase/, src/shared/types/]
    decisiones: [B18, B19, C1, C2, C3, F2, F5, X4, X12, X13, E6, X17]
    decisiones_ronda4: [R4.4, R4.8, R4.12, R4.15, R4.17]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 2, comando: "pnpm db:reset && pnpm db:types && pnpm db:probar && pnpm lint && pnpm typecheck && pnpm test"}
    terminado: >-
      Una migración nueva (la base del kit no se toca) con tablas, enums, índices, la restricción de
      exclusión y el índice único de §3; catálogo de permisos y permisos_rol de §2 con insert … on
      conflict, tiene_permiso e ids_con_alcance; RLS, revoke y grants explícitos según la regla del kit;
      triggers de columnas protegidas y de actualizado_en; bucket equipo con policies; seed.sql;
      supabase/tests/rls-calesa.sql con las 47 filas de §4; tipos regenerados con pnpm db:types.

  - id: P03
    titulo: Fórmulas de calculadora y escala, y precios (entities)
    depende_de: [P01]
    carril: calculadora
    riesgo: rojo
    modulos: [src/modules/calculadora/entities/, src/modules/calculadora/CLAUDE.md, src/modules/calculadora/index.ts, src/modules/calculadora/client.ts, src/modules/planes/]
    decisiones: [B4, B6, B7, B8, X3, A3]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 1, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check"}
    terminado: >-
      Módulos calculadora (entities) y planes con su ficha CLAUDE.md; funciones puras con schemas Zod;
      tests al lado con los ejemplos 1, 2 y 3 de §5.2, los casos A-E de §5.3 y las reglas de §5.4;
      planes expone tarjetas y tabla por pantallas/.

  - id: P04
    titulo: Reglas de agenda y de solicitudes (entities)
    depende_de: [P01]
    carril: ventas
    riesgo: ambar
    modulos: [src/modules/agenda/entities/, src/modules/agenda/CLAUDE.md, src/modules/agenda/index.ts, src/modules/solicitudes/entities/, src/modules/solicitudes/CLAUDE.md, src/modules/solicitudes/index.ts]
    decisiones: [B10, B11, B12, X1, X2, X5, X10]
    decisiones_ronda4: [R4.1, R4.5, R4.7, R4.9, R4.13]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: {nivel: 1, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check"}
    terminado: >-
      horasDisponibles y elegirAnfitrion (agenda), y transiciones de §5.7 y juntar repetidas (solicitudes)
      como funciones puras con tests de todos los ejemplos de §5.5, §5.6 y §5.7, incluidos Bogotá,
      Santiago con su cambio de horario y Madrid; fichas CLAUDE.md de los dos módulos.

  - id: P05
    titulo: RPC de reserva, asignación, estados, WhatsApp, configuración y retención; triggers de métricas
    depende_de: [P02, P04]
    carril: datos
    riesgo: rojo
    modulos: [supabase/, src/shared/types/]
    decisiones: [B13, B14, B15, B17, C2, X5, X6, X10]
    decisiones_ronda4: [R4.1, R4.2, R4.3, R4.5, R4.7, R4.9, R4.16, R4.17, R4.19, R4.21]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 2, comando: "pnpm db:reset && pnpm db:types && pnpm db:probar && pnpm lint && pnpm typecheck && pnpm test"}
    terminado: >-
      Migración nueva con las RPC de §3 y §5 (crear_o_juntar_solicitud, datos_para_horas,
      reservar_reunion, cambiar_reunion, cancelar_reunion, cambiar_estado_solicitud, reasignar_solicitud,
      desactivar_usuario, actualizar_meet, elegir_whatsapp, borrar_solicitud, guardar_config_calculadora,
      registrar_evento, retencion_diaria), las de edición con p_actualizado_en_esperado y PT409; trigger
      de la máquina de estados; triggers de metricas_diarias, metricas_persona y auditoria;
      supabase/tests/reservas.sql, estados.sql y retencion.sql cubren doble reserva, máximo diario,
      preferencia por el asignado, reasignación con y sin hueco, desactivación sin reemplazo, repetidas,
      retención y borrado a pedido.

  - id: P06
    titulo: Seguridad compartida (Turnstile, límites por IP, tokens firmados, secreto del cron)
    depende_de: [P01, P02]
    carril: base
    riesgo: rojo
    modulos: [src/shared/lib/seguridad/]
    decisiones: [C7, F5, F8]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 1, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check"}
    terminado: >-
      verificarTurnstile, limitar(accion, ip) sobre la RPC de limites (5/h formulario y detalle, 10/h
      reservas, 30/h WhatsApp, 60/h eventos), firmar y verificar el token de solicitud (2 h), generar el
      token de reunión (32 bytes, guarda sha256) y verificar el secreto del cron en tiempo constante; tests
      de vencimiento, manipulación y límite.

  - id: P07
    titulo: Notificaciones (plantillas, enviar, programar, cancelar, registro)
    depende_de: [P01, P02]
    carril: notificaciones
    riesgo: ambar
    modulos: [src/modules/notificaciones/]
    decisiones: [B16, B17, F4, X6, X9, D6]
    decisiones_ronda4: [R4.11, R4.21]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: {nivel: 1, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check"}
    terminado: >-
      Las 12 plantillas de §6.8 con marca y modo texto; enviarAhora (2 reintentos), programar, cancelar y
      reprogramar sobre enviarEmail() del kit, registrando cada una en correos_salientes con resend_id y
      referencia idempotente; .ics REQUEST y CANCEL con UID y SEQUENCE; tests de render y de .ics con la
      reunión de ejemplo; ficha CLAUDE.md.

  # Propuesto por P06 (docs/pasos/P06/decisiones.md).
  - id: P32
    titulo: RPC del límite de envíos (contar_envio)
    depende_de: [P02, P05]
    carril: datos
    riesgo: rojo
    modulos: [supabase/, src/shared/types/]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 2, comando: "pnpm db:reset && pnpm db:types && pnpm db:probar && pnpm lint && pnpm typecheck && pnpm test"}
    terminado: >-
      contar_envio(p_clave, p_maximo, p_ventana_segundos) returns boolean, security definer con
      search_path vacío, sólo service_role; ventana fija en un solo insert … on conflict … returning;
      su prueba en supabase/tests/ con la tabla de casos de ContarEnvio; tipos regenerados.

  # Propuesto por P05 (docs/pasos/P05/decisiones.md).
  - id: P30
    titulo: RPC de solicitudes (crear o juntar, reasignar, desactivar, borrar) y retención
    depende_de: [P05, P32]
    carril: datos
    riesgo: rojo
    modulos: [supabase/, src/shared/types/]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 2, comando: "pnpm db:reset && pnpm db:types && pnpm db:probar && pnpm lint && pnpm typecheck && pnpm test"}
    terminado: >-
      crear_o_juntar_solicitud (reparto §5.6, prospección R4.19, repetidas R4.5 con auditoría «juntada»),
      reasignar_solicitud (R4.2, con y sin hueco), desactivar_usuario (R3.3, R4.3, reparte las abiertas),
      borrar_solicitud (R4.17) y retencion_diaria (C2, también limpia limites de más de 2 días); claves
      solicitudes.reasignar y solicitudes.borrar; supabase/tests/solicitudes-rpc.sql y retencion.sql.

  # Propuesto por P07 (docs/pasos/P07/decisiones.md).
  - id: P27
    titulo: RPC del registro de correos (correos_salientes)
    depende_de: [P02, P05, P30]
    carril: datos
    riesgo: rojo
    modulos: [supabase/, src/shared/types/]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 2, comando: "pnpm db:reset && pnpm db:types && pnpm db:probar && pnpm lint && pnpm typecheck && pnpm test"}
    terminado: >-
      RPC de correos_salientes: registrar, marcar enviado, fallido, cancelado y reprogramado; leer por
      referencia, id, reunión o solicitud, y los vencidos, con su índice de vencidos; security definer,
      search_path vacío, sólo service_role; pruebas en supabase/tests/; tipos regenerados.

  # Propuesto por P05 (docs/pasos/P05/decisiones.md).
  - id: P31
    titulo: RPC del Meet, WhatsApp, eventos y configuración; triggers de métricas
    depende_de: [P05, P27]
    carril: datos
    riesgo: rojo
    modulos: [supabase/, src/shared/types/]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 2, comando: "pnpm db:reset && pnpm db:types && pnpm db:probar && pnpm lint && pnpm typecheck && pnpm test"}
    terminado: >-
      actualizar_meet (R4.21), elegir_whatsapp (§5.6), registrar_evento, guardar_config_calculadora (clave
      calculadora.configurar), los triggers de metricas_diarias y metricas_persona, la auditoría de rol y
      config; supabase/tests/personas.sql y metricas.sql.

  # Propuesto por P02 (docs/pasos/P02/decisiones.md, «Para el coordinador»), que P05 dejó pendiente.
  - id: P34
    titulo: RPC de usuarios, turnos, horario y fotos que quedaron sin dueño
    depende_de: [P30, P31]
    carril: datos
    riesgo: rojo
    modulos: [supabase/, src/shared/types/]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 2, comando: "pnpm db:reset && pnpm db:types && pnpm db:probar && pnpm lint && pnpm typecheck && pnpm test"}
    terminado: >-
      cambiar_en_turno, reactivar_usuario y asignar_rol; guardar_config_agenda y guardar_horario_base;
      variantes de reasignar_solicitud y desactivar_usuario que authenticated pueda ejecutar con su
      chequeo de permiso; crear el perfil al aceptar una invitación; el recolector de fotos huérfanas del
      bucket equipo; los casos permitidos de las filas 9, 35, 36 y 38 de la matriz; pruebas en supabase/tests/.

  # Propuesto por P07 (docs/pasos/P07/decisiones.md).
  - id: P28
    titulo: Adjuntos en el correo y fecha con día de la semana
    depende_de: [P01, P06]
    carril: base
    riesgo: rojo
    modulos: [src/shared/lib/]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 1, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check"}
    terminado: >-
      adjuntos en esquemaDeMensaje y en los adaptadores mailpit y resend-api; formato de fecha con día de la
      semana en fechas.ts (§6.8: «mar 3 nov, 10:00»); tests.

  # Propuesto por P06 (docs/pasos/P06/decisiones.md).
  - id: P33
    titulo: Enlazar el límite de envíos con su RPC
    depende_de: [P06, P28, P32]
    carril: base
    riesgo: rojo
    modulos: [src/shared/lib/seguridad/]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 1, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check"}
    terminado: >-
      contadorDeSupabase(cliente) implementa ContarEnvio con cliente.rpc('contar_envio', …): el cliente entra
      por parámetro, valida la respuesta con Zod y mapea el error con errorDePostgrest; sus pruebas corren la
      misma tabla de casos que crearContadorEnMemoria. Cierra lo pendiente del terminado de P06.

  # Propuesto por P07 (docs/pasos/P07/decisiones.md).
  - id: P29
    titulo: Registro de correos sobre sus RPC y .ics adjunto
    depende_de: [P07, P27, P28]
    carril: notificaciones
    riesgo: ambar
    modulos: [src/modules/notificaciones/]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: {nivel: 1, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check"}
    terminado: >-
      Adaptador de RegistroDeCorreos sobre las RPC de correos_salientes (el cliente entra por parámetro);
      el .ics sale adjunto (text/calendar; method=REQUEST|CANCEL); las plantillas usan la fecha con día;
      cierra lo pendiente del terminado de P07.

  - id: P20
    titulo: Equipo y prospección (entities, lectura pública, sección «Quiénes somos»)
    depende_de: [P02]
    carril: equipo
    riesgo: ambar
    modulos: [src/modules/equipo/, src/modules/prospeccion/entities/, src/modules/prospeccion/CLAUDE.md, src/modules/prospeccion/index.ts]
    decisiones: [A6, E6]
    decisiones_ronda4: [R4.19]
    ruteo: {agente: claude, modelo: sonnet, effort: high, modo: auto, sesion: nueva, revisor: ninguno}
    verificacion: {nivel: 1, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check"}
    terminado: >-
      equipo expone la sección pública por pantallas/ leyendo solo filas visibles; prospeccion normaliza y
      valida códigos (R4.19) con tests; fichas CLAUDE.md.

  - id: P11
    titulo: Flujo público de agenda (formulario con gráfica, horas, reserva, confirmación, gestión)
    depende_de: [P03, P04, P05, P06, P07, P30, P33, P29]
    carril: ventas
    riesgo: rojo
    modulos: [src/modules/agenda/features/, src/modules/agenda/infra/, src/modules/agenda/pantallas/, src/modules/agenda/client.ts, src/modules/solicitudes/features/formulario/, src/modules/solicitudes/infra/, src/modules/solicitudes/pantallas/, src/modules/solicitudes/client.ts, src/app/agendar/, src/app/reunion/, src/app/api/solicitudes/, src/app/api/reservas/, src/app/api/horas/, e2e/ventas/agenda/]
    decisiones: [A1, A4, B8, B9, B10, B11, B12, B13, B15, B16, C1, C4, C7, D1, D3, D4, X1, X5]
    decisiones_ronda4: [R4.5, R4.10, R4.13, R4.16, R4.18, R4.19, R4.20]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 2, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check && pnpm db:reset && pnpm db:probar && pnpm test:e2e:completo"}
    terminado: >-
      /agendar con los 3 pasos de §6.4 (borrador en sessionStorage, prellenado desde la calculadora,
      gráfica de calculadora por su client.ts, aviso sin-whatsapp); /api/solicitudes, /api/reservas y
      /api/horas con Turnstile, límite, token y Zod llamando solo a sus RPC; enlace con ref limitado al
      creador; /reunion/[token] cambia, cancela con el plazo de 2 h y ofrece «Elegir otra hora»;
      correos enviados y recordatorios programados; e2e con reloj fijo de los recorridos 1, 2, 4 y 5 de
      §6.1 y todos los estados de /agendar y /reunion de §6.5.

  - id: P09
    titulo: Calculadora pública, planes y tabla completa, prueba del cliente (textos con cifras)
    depende_de: [P03, P02, P11]
    carril: calculadora
    riesgo: rojo
    modulos: [src/modules/calculadora/features/publica/, src/modules/calculadora/infra/, src/modules/calculadora/pantallas/, src/modules/planes/, e2e/calculadora/publica.spec.ts, e2e/calculadora/planes.spec.ts]
    decisiones: [A2, B4, B5, B6, B7, X3, X11]
    decisiones_ronda4: [R4.18]
    ruteo: {agente: claude, modelo: opus, effort: xhigh, modo: plan→manual, sesion: nueva, revisor: claude-sesion-nueva}
    verificacion: {nivel: 1, comando: "pnpm lint && pnpm typecheck && pnpm test && bash scripts/mapa.sh --check && pnpm test:e2e e2e/calculadora/"}
    terminado: >-
      Pantallas de calculadora (5 datos, rango, desglose, horas, «Cómo se calculó» leyendo
      config_calculadora, evento calesa:evento al primer resultado, detalle por correo vía
      /api/solicitudes) y de planes (tarjetas con cuota al frente y selector anual; tabla completa de §6.3
      con los dos textos de pie, sin la regla de exceso de autos); bloque de prueba con el texto exacto de
      A0.2; e2e reproduce el ejemplo 1 (US$ 4.452 y US$ 8.935).

  - id: P08
    titulo: Sitio público (inicio con sus 10 secciones, /planes, navegación, maquetas, ilustraciones)
    depende_de: [P09, P20]
